[package]
name = "signet-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
keepass = { version = "0.15", features = ["save_kdbx4"] }
libc = "0.2"
rust-argon2 = "3"
tempfile = "3.27.0"
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-openssl", "compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
tracing = "0.1.44"
ureq = "3"
url = "2"
uuid = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
