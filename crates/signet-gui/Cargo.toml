[package]
name = "signet-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
anyhow = "1"
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signet = { path = "../signet" }
signet-vault = { path = "../signet-vault" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"
